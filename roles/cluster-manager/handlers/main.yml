---
- name: Restart Splunk
  community.docker.docker_container:
    name: splunk-cluster-manager
    state: started
    restart: true


- name: Validate Indexer Cluster Bundle
  community.docker.docker_container_exec:
    container: splunk-cluster-manager
    user: splunk
    argv:
      - "{{ splunk_home }}/bin/splunk"
      - validate
      - cluster-bundle
      - -auth
      - "{{ splunk_admin_user }}:{{ splunk_admin_password }}"
  changed_when: false
  no_log: true
  listen: Apply Indexer Cluster Bundle


- name: Apply Indexer Cluster Bundle
  community.docker.docker_container_exec:
    container: splunk-cluster-manager
    user: splunk
    argv:
      - "{{ splunk_home }}/bin/splunk"
      - apply
      - cluster-bundle
      - -auth
      - "{{ splunk_admin_user }}:{{ splunk_admin_password }}"
  no_log: true
  listen: Apply Indexer Cluster Bundle