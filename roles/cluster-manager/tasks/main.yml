---
- name: Create a volume for Cluster Manager data
  community.docker.docker_volume:
    name: splunk_cm_data


- name: Create Splunk Cluster Manager container
  community.docker.docker_container:
    name: splunk-cluster-manager
    image: splunk/splunk:latest
    state: started
    restart_policy: unless-stopped
    pull: true

    published_ports:
      - "8000:8000"
      - "8089:8089"
      - "9997:9997"

    volumes:
      - "splunk_cm_data:/opt/splunk"

    env:
      SPLUNK_GENERAL_TERMS: "--accept-sgt-current-at-splunk-com"
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_PASSWORD: "{{ splunk_admin_password }}"


- name: Wait for Splunk container to become healthy
  community.docker.docker_container_info:
    name: splunk-cluster-manager
  register: splunk_container_info
  retries: 30
  delay: 10
  until:
    - splunk_container_info.container is defined
    - splunk_container_info.container.State is defined
    - splunk_container_info.container.State.Health is defined
    - splunk_container_info.container.State.Health.Status == "healthy"
  changed_when: false


- name: Check Splunk Cluster Manager status
  community.docker.docker_container_exec:
    container: splunk-cluster-manager
    user: splunk
    command: /opt/splunk/bin/splunk status
  register: splunk_status
  retries: 30
  delay: 10
  until:
    - splunk_status.stdout is defined
    - "'splunkd is running' in splunk_status.stdout"
  changed_when: false


- name: Show Splunk Cluster Manager status
  ansible.builtin.debug:
    var: splunk_status.stdout_lines


- name: Get Splunk UID
  community.docker.docker_container_exec:
    container: splunk-cluster-manager
    command: id -u splunk
  register: splunk_uid
  changed_when: false


- name: Get Splunk GID
  community.docker.docker_container_exec:
    container: splunk-cluster-manager
    command: id -g splunk
  register: splunk_gid
  changed_when: false


- name: Show Splunk UID and GID
  ansible.builtin.debug:
    msg:
      - "Splunk UID: {{ splunk_uid.stdout }}"
      - "Splunk GID: {{ splunk_gid.stdout }}"


- name: Configure Cluster Manager
  community.docker.docker_container_exec:
    container: splunk-cluster-manager
    user: splunk
    argv:
      - "{{ splunk_home }}/bin/splunk"
      - edit
      - cluster-config
      - -mode
      - manager
      - -replication_factor
      - "{{ replication_factor | string }}"
      - -search_factor
      - "{{ search_factor | string }}"
      - -secret
      - "{{ cluster_secret }}"
      - -cluster_label
      - "{{ cluster_label }}"
      - -auth
      - "{{ splunk_admin_user }}:{{ splunk_admin_password }}"
  register: cluster_manager_config
  no_log: true
  notify: Restart Splunk


# Run the Restart Splunk handler now instead of waiting until
# the end of the play.
- name: Apply Cluster Manager configuration restart
  ansible.builtin.meta: flush_handlers


# After container restart, wait until Docker reports Splunk healthy again.
- name: Wait for Cluster Manager after restart
  community.docker.docker_container_info:
    name: splunk-cluster-manager
  register: splunk_cm_after_restart
  retries: 30
  delay: 10
  until:
    - splunk_cm_after_restart.container is defined
    - splunk_cm_after_restart.container.State is defined
    - splunk_cm_after_restart.container.State.Health is defined
    - splunk_cm_after_restart.container.State.Health.Status == "healthy"
  changed_when: false


- name: Verify Splunk is running after Cluster Manager restart
  community.docker.docker_container_exec:
    container: splunk-cluster-manager
    user: splunk
    argv:
      - "{{ splunk_home }}/bin/splunk"
      - status
  register: splunk_cm_status_after_restart
  retries: 30
  delay: 10
  until:
    - splunk_cm_status_after_restart.rc == 0
    - "'splunkd is running' in splunk_cm_status_after_restart.stdout"
  changed_when: false


- name: Create custom index app directory
  community.docker.docker_container_exec:
    container: splunk-cluster-manager
    user: splunk
    argv:
      - mkdir
      - -p
      - "{{ splunk_home }}/etc/manager-apps/ta_index_custom_app/local"
  changed_when: false


- name: Create indexes.conf
  community.docker.docker_container_copy_into:
    container: splunk-cluster-manager
    owner_id: "{{ splunk_uid.stdout | int }}"
    group_id: "{{ splunk_gid.stdout | int }}"
    mode: "0644"
    mode_parse: modern
    container_path: "{{ splunk_home }}/etc/manager-apps/ta_index_custom_app/local/indexes.conf"
    content: |
      [infra_linux_custom_index]
      homePath = $SPLUNK_DB/infra_linux_custom_index/db
      coldPath = $SPLUNK_DB/infra_linux_custom_index/colddb
      thawedPath = $SPLUNK_DB/infra_linux_custom_index/thaweddb
  notify: Apply Indexer Cluster Bundle


# Run cluster bundle validation/application now instead of at play end.
- name: Apply Indexer Cluster Bundle now
  ansible.builtin.meta: flush_handlers


- name: Verify Cluster Manager status
  community.docker.docker_container_exec:
    container: splunk-cluster-manager
    user: splunk
    argv:
      - "{{ splunk_home }}/bin/splunk"
      - show
      - cluster-status
      - -auth
      - "{{ splunk_admin_user }}:{{ splunk_admin_password }}"
  register: cluster_status
  changed_when: false
  no_log: false


- name: Show Cluster Manager status
  ansible.builtin.debug:
    var: cluster_status.stdout_lines