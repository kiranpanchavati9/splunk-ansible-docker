- name: Create a Volume for Heavy Forwarder Data
  community.docker.docker_volume:
    name: splunk_hf_data
    driver: local

- name: Create a Docker Container for Heavy Forwarder
  community.docker.docker_container:
    name: splunk-heavy-forwarder
    image: splunk/splunk:latest
    state: started
    restart: true
    published_ports:
      - "8080:8080"
      - "8089:8089"
      - "9997:9997"
    volumes:
      - splunk_hf_data:/opt/splunk/
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD={{ splunk_admin_password }}


- name: Check the status of the Heavy Forwarder container
  community.docker.docker_container_exec:
    container: splunk-heavy-forwarder
    command: /opt/splunk/bin/splunk status
  register: splunk_status
  changed_when: splunk_status.rc == 0


- name: Show Splunk HF status
  ansible.builtin.debug:
    var: splunk_status.stdout_lines


