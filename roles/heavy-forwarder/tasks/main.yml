---
- name: Create a volume for Heavy Forwarder data
  community.docker.docker_volume:
    name: splunk_hf_data

- name: Create Splunk Heavy Forwarder container
  community.docker.docker_container:
    name: splunk-heavy-forwarder
    image: splunk/splunk:latest
    state: started
    restart_policy: unless-stopped
    pull: true

    published_ports:
      - "8000:8000"
      - "8089:8089"
      - "9997:9997"

    volumes:
      - "splunk_hf_data:/opt/splunk"

    env:
      SPLUNK_GENERAL_TERMS: "--accept-sgt-current-at-splunk-com"
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_PASSWORD: "{{ splunk_admin_password }}"

- name: Check Splunk Heavy Forwarder status
  community.docker.docker_container_exec:
    container: splunk-heavy-forwarder
    user: splunk
    command: /opt/splunk/bin/splunk status
  register: splunk_status
  retries: 30
  delay: 10
  until:
    - splunk_status.stdout is defined
    - "'splunkd is running' in splunk_status.stdout"
  changed_when: false

- name: Show Splunk Heavy Forwarder status
  ansible.builtin.debug:
    var: splunk_status.stdout_lines


- name: Show configured Deployment Server
  community.docker.docker_container_exec:
    container: splunk-heavy-forwarder
    user: splunk
    argv:
      - /opt/splunk/bin/splunk
      - show
      - deploy-poll
      - -auth
      - "{{ splunk_admin_user }}:{{ splunk_admin_password }}"
  register: deploy_poll_status
  changed_when: false
  no_log: true


- name: Verify Deployment Server port connectivity
  community.docker.docker_container_exec:
    container: splunk-heavy-forwarder
    command: >
      bash -c 'timeout 5 bash -c "</dev/tcp/{{ deployment_server_uri }}/8089"'
  register: deployment_server_connectivity
  changed_when: false
  no_log: true

- name: Show Deployment Server connectivity status
  ansible.builtin.debug:
    var: deployment_server_connectivity.stdout_lines
  changed_when: false
  no_log: true


