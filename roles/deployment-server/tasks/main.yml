---
- name: Create a volume for Deployment Server data
  community.docker.docker_volume:
    name: splunk_ds_data

- name: Create Splunk Deployment Server container
  community.docker.docker_container:
    name: splunk-deployment-server
    image: splunk/splunk:latest
    state: started
    restart_policy: unless-stopped
    pull: true

    published_ports:
      - "8000:8000"
      - "8089:8089"
      - "9997:9997"

    volumes:
      - "splunk_ds_data:/opt/splunk"

    env:
      SPLUNK_GENERAL_TERMS: "--accept-sgt-current-at-splunk-com"
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_PASSWORD: "{{ splunk_admin_password }}"

- name: Check Splunk Deployment Server status
  community.docker.docker_container_exec:
    container: splunk-deployment-server
    user: splunk
    command: /opt/splunk/bin/splunk status
  register: splunk_status
  retries: 30
  delay: 10
  until:
    - splunk_status.stdout is defined
    - "'splunkd is running' in splunk_status.stdout"
  changed_when: false

- name: Show Splunk Deployment Server status
  ansible.builtin.debug:
    var: splunk_status.stdout_lines



