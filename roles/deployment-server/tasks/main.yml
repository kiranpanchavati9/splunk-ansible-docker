---
- name: Create a volume for Deployment Server data
  community.docker.docker_volume:
    name: splunk_ds_data


- name: Create Splunk Deployment Server container
  community.docker.docker_container:
    name: splunk-deployment-server
    image: splunk/splunk:latest
    state: started
    restart_policy: unless-stopped
    pull: true

    published_ports:
      - "8000:8000"
      - "8089:8089"
      - "9997:9997"

    volumes:
      - "splunk_ds_data:/opt/splunk"

    env:
      SPLUNK_GENERAL_TERMS: "--accept-sgt-current-at-splunk-com"
      SPLUNK_START_ARGS: "--accept-license"
      SPLUNK_PASSWORD: "{{ splunk_admin_password }}"


- name: Wait for Splunk container to become healthy
  community.docker.docker_container_info:
    name: splunk-deployment-server
  register: splunk_container_info
  retries: 30
  delay: 10
  until:
    - splunk_container_info.container is defined
    - splunk_container_info.container.State is defined
    - splunk_container_info.container.State.Health is defined
    - splunk_container_info.container.State.Health.Status == "healthy"
  changed_when: false


- name: Check Splunk Deployment Server status
  community.docker.docker_container_exec:
    container: splunk-deployment-server
    user: splunk
    command: /opt/splunk/bin/splunk status
  register: splunk_status
  retries: 30
  delay: 10
  until:
    - splunk_status.stdout is defined
    - "'splunkd is running' in splunk_status.stdout"
  changed_when: false


- name: Show Splunk Deployment Server status
  ansible.builtin.debug:
    var: splunk_status.stdout_lines


- name: Get Splunk UID
  community.docker.docker_container_exec:
    container: splunk-deployment-server
    command: id -u splunk
  register: splunk_uid
  changed_when: false


- name: Get Splunk GID
  community.docker.docker_container_exec:
    container: splunk-deployment-server
    command: id -g splunk
  register: splunk_gid
  changed_when: false


- name: Show Splunk UID and GID
  ansible.builtin.debug:
    msg:
      - "Splunk UID: {{ splunk_uid.stdout }}"
      - "Splunk GID: {{ splunk_gid.stdout }}"


- name: Create deployment app directories
  community.docker.docker_container_exec:
    container: splunk-deployment-server
    user: splunk
    argv:
      - mkdir
      - -p
      - "{{ splunk_home }}/etc/deployment-apps/infra_linux_custom_app/local"
      - "{{ splunk_home }}/etc/deployment-apps/infra_linux_custom_app/default"
  changed_when: false


- name: Create serverclass.conf
  community.docker.docker_container_copy_into:
    container: splunk-deployment-server
    container_path: "{{ splunk_home }}/etc/system/local/serverclass.conf"
    content: |
      [serverClass:dev_infrateam_linux]
      whitelist.0 = *

      [serverClass:dev_infrateam_linux:app:infra_linux_custom_app]
      restartSplunkd = true
    owner_id: "{{ splunk_uid.stdout | int }}"
    group_id: "{{ splunk_gid.stdout | int }}"
    mode: "0644"
    mode_parse: modern
  notify:
    - Reload Splunk Deployment Server


- name: Create app.conf
  community.docker.docker_container_copy_into:
    container: splunk-deployment-server
    container_path: "{{ splunk_home }}/etc/deployment-apps/infra_linux_custom_app/default/app.conf"
    content: |
      [launcher]
      author = Splunk
      description = Custom app for deployment server
      version = 1.0.0

      [package]
      id = infra_linux_custom_app
    owner_id: "{{ splunk_uid.stdout | int }}"
    group_id: "{{ splunk_gid.stdout | int }}"
    mode: "0644"
    mode_parse: modern
  notify:
    - Reload Splunk Deployment Server


- name: Create inputs.conf
  community.docker.docker_container_copy_into:
    container: splunk-deployment-server
    container_path: "{{ splunk_home }}/etc/deployment-apps/infra_linux_custom_app/local/inputs.conf"
    content: |
      [monitor:///var/log/secure]
      sourcetype = infra_linux_custom_sourcetype
      index = infra_linux_custom_index
      disabled = false
    owner_id: "{{ splunk_uid.stdout | int }}"
    group_id: "{{ splunk_gid.stdout | int }}"
    mode: "0644"
    mode_parse: modern
  notify:
    - Reload Splunk Deployment Server


- name: Create outputs.conf
  community.docker.docker_container_copy_into:
    container: splunk-deployment-server
    container_path: "{{ splunk_home }}/etc/deployment-apps/infra_linux_custom_app/local/outputs.conf"
    content: |
      [tcpout]
      defaultGroup = indexergroup

      [tcpout:indexergroup]
      server = {{ indexer_1_uri }}, {{ indexer_2_uri }}
    owner_id: "{{ splunk_uid.stdout | int }}"
    group_id: "{{ splunk_gid.stdout | int }}"
    mode: "0644"
    mode_parse: modern
  notify:
    - Reload Splunk Deployment Server


- name: Validate serverclass configuration
  community.docker.docker_container_exec:
    container: splunk-deployment-server
    user: splunk
    command: >
      /opt/splunk/bin/splunk btool serverclass list --debug
  register: serverclass_btool
  changed_when: false


- name: Show serverclass configuration
  ansible.builtin.debug:
    var: serverclass_btool.stdout_lines


- name: Validate deployment app inputs
  community.docker.docker_container_exec:
    container: splunk-deployment-server
    user: splunk
    command: >
      /opt/splunk/bin/splunk btool inputs list
      --app=infra_linux_custom_app
      --debug
  register: inputs_btool
  changed_when: false


- name: Show deployment app inputs
  ansible.builtin.debug:
    var: inputs_btool.stdout_lines


- name: Validate deployment app outputs
  community.docker.docker_container_exec:
    container: splunk-deployment-server
    user: splunk
    command: >
      /opt/splunk/bin/splunk btool outputs list
      --app=infra_linux_custom_app
      --debug
  register: outputs_btool
  changed_when: false


- name: Show deployment app outputs
  ansible.builtin.debug:
    var: outputs_btool.stdout_lines


- name: List Deployment Server clients
  community.docker.docker_container_exec:
    container: splunk-deployment-server
    user: splunk
    command: >
      /opt/splunk/bin/splunk list deploy-clients
      -auth admin:{{ splunk_admin_password }}
  register: deploy_clients
  changed_when: false
  failed_when: false


- name: Show Deployment Server clients
  ansible.builtin.debug:
    var: deploy_clients.stdout_lines