- name: Install required storage packages
  ansible.builtin.dnf:
    name:
      - lvm2
      - xfsprogs
      - rsync
    state: present

- name: Create DataVG using the 300GB disk
  community.general.lvg:
    vg: DataVG
    pvs: /dev/nvme1n1
    state: present

- name: Create 100GB Splunk logical volume
  community.general.lvol:
    vg: DataVG
    lv: splunkVol
    size: 100g
    shrink: false
    state: present

- name: Create varLibVol using remaining free space
  community.general.lvol:
    vg: DataVG
    lv: varLibVol
    size: 100%FREE
    shrink: false
    state: present

- name: Create XFS filesystem for Splunk
  community.general.filesystem:
    fstype: xfs
    dev: /dev/DataVG/splunkVol

- name: Create XFS filesystem for var lib
  community.general.filesystem:
    fstype: xfs
    dev: /dev/DataVG/varLibVol

- name: Create temporary Splunk mount point
  ansible.builtin.file:
    path: /mnt/new_splunk
    state: directory
    mode: '0755'

- name: Create temporary var lib mount point
  ansible.builtin.file:
    path: /mnt/new_var_lib
    state: directory
    mode: '0755'

- name: Temporarily mount Splunk LV
  ansible.posix.mount:
    path: /mnt/new_splunk
    src: /dev/DataVG/splunkVol
    fstype: xfs
    state: mounted

- name: Temporarily mount var lib LV
  ansible.posix.mount:
    path: /mnt/new_var_lib
    src: /dev/DataVG/varLibVol
    fstype: xfs
    state: mounted

- name: Ensure /opt/splunk exists
  ansible.builtin.file:
    path: /opt/splunk
    state: directory
    mode: '0755'

- name: Copy existing Splunk data
  ansible.builtin.command:
    cmd: rsync -aHAX --numeric-ids /opt/splunk/ /mnt/new_splunk/
  changed_when: true

- name: Copy existing var lib data
  ansible.builtin.command:
    cmd: rsync -aHAX --numeric-ids /var/lib/ /mnt/new_var_lib/
  changed_when: true

- name: Unmount temporary Splunk filesystem
  ansible.posix.mount:
    path: /mnt/new_splunk
    state: unmounted

- name: Unmount temporary var lib filesystem
  ansible.posix.mount:
    path: /mnt/new_var_lib
    state: unmounted

- name: Permanently mount Splunk LV
  ansible.posix.mount:
    path: /opt/splunk
    src: /dev/DataVG/splunkVol
    fstype: xfs
    opts: defaults
    dump: '0'
    passno: '0'
    state: mounted

- name: Permanently mount var lib LV
  ansible.posix.mount:
    path: /var/lib
    src: /dev/DataVG/varLibVol
    fstype: xfs
    opts: defaults
    dump: '0'
    passno: '0'
    state: mounted

- name: Verify storage
  ansible.builtin.command:
    cmd: df -h /opt/splunk /var/lib
  register: storage_df
  changed_when: false

- name: Display storage
  ansible.builtin.debug:
    var: storage_df.stdout_lines