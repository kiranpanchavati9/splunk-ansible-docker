---
- name: Install required storage packages
  ansible.builtin.dnf:
    name:
      - lvm2
      - xfsprogs
      - rsync
    state: present

# ---------------------------------------------------------
# Create LVM PV on 300 GB disk
# ---------------------------------------------------------
- name: Create physical volume on nvme1n1
  ansible.builtin.command:
    cmd: pvcreate /dev/nvme1n1
  register: pvcreate_result
  failed_when:
    - pvcreate_result.rc != 0
    - "'already' not in pvcreate_result.stderr | lower"
  changed_when: pvcreate_result.rc == 0

# ---------------------------------------------------------
# Create dedicated VG
# ---------------------------------------------------------
- name: Create Docker/Splunk volume group
  community.general.lvg:
    vg: DataVG
    pvs: /dev/nvme1n1

# ---------------------------------------------------------
# Create 100 GB for Splunk
# ---------------------------------------------------------
- name: Create Splunk logical volume
  community.general.lvol:
    vg: DataVG
    lv: splunkVol
    size: 100g
    shrink: false

# ---------------------------------------------------------
# Create remaining space for /var/lib
# ---------------------------------------------------------
- name: Create var lib logical volume
  community.general.lvol:
    vg: DataVG
    lv: varLibVol
    size: 100%FREE
    shrink: false

# ---------------------------------------------------------
# Format filesystems
# ---------------------------------------------------------
- name: Create XFS filesystem for Splunk
  community.general.filesystem:
    fstype: xfs
    dev: /dev/DataVG/splunkVol

- name: Create XFS filesystem for var lib
  community.general.filesystem:
    fstype: xfs
    dev: /dev/DataVG/varLibVol

# ---------------------------------------------------------
# Temporary mount points
# ---------------------------------------------------------
- name: Create temporary Splunk mount
  ansible.builtin.file:
    path: /mnt/new_splunk
    state: directory
    mode: '0755'

- name: Create temporary var lib mount
  ansible.builtin.file:
    path: /mnt/new_var_lib
    state: directory
    mode: '0755'

# ---------------------------------------------------------
# Temporarily mount new filesystems
# ---------------------------------------------------------
- name: Mount Splunk LV temporarily
  ansible.posix.mount:
    path: /mnt/new_splunk
    src: /dev/mapper/DataVG-splunkVol
    fstype: xfs
    state: mounted

- name: Mount var lib LV temporarily
  ansible.posix.mount:
    path: /mnt/new_var_lib
    src: /dev/mapper/DataVG-varLibVol
    fstype: xfs
    state: mounted

# ---------------------------------------------------------
# Copy existing data if present
# ---------------------------------------------------------
- name: Ensure /opt/splunk exists
  ansible.builtin.file:
    path: /opt/splunk
    state: directory
    mode: '0755'

- name: Copy existing Splunk data
  ansible.builtin.command:
    cmd: rsync -aHAX --numeric-ids /opt/splunk/ /mnt/new_splunk/
  changed_when: true

- name: Copy existing var lib data
  ansible.builtin.command:
    cmd: rsync -aHAX --numeric-ids /var/lib/ /mnt/new_var_lib/
  changed_when: true

# ---------------------------------------------------------
# Unmount temporary mounts
# ---------------------------------------------------------
- name: Unmount temporary Splunk filesystem
  ansible.posix.mount:
    path: /mnt/new_splunk
    state: unmounted

- name: Unmount temporary var lib filesystem
  ansible.posix.mount:
    path: /mnt/new_var_lib
    state: unmounted

# ---------------------------------------------------------
# Permanent mounts
# ---------------------------------------------------------
- name: Mount Splunk LV on /opt/splunk
  ansible.posix.mount:
    path: /opt/splunk
    src: /dev/mapper/DataVG-splunkVol
    fstype: xfs
    opts: defaults
    dump: '0'
    passno: '0'
    state: mounted

- name: Mount var lib LV on /var/lib
  ansible.posix.mount:
    path: /var/lib
    src: /dev/mapper/DataVG-varLibVol
    fstype: xfs
    opts: defaults
    dump: '0'
    passno: '0'
    state: mounted

# ---------------------------------------------------------
# Verification
# ---------------------------------------------------------
- name: Verify storage layout
  ansible.builtin.command:
    cmd: df -h /opt/splunk /var/lib
  register: storage_df
  changed_when: false

- name: Display storage layout
  ansible.builtin.debug:
    var: storage_df.stdout_lines

- name: Display LVM layout
  ansible.builtin.command:
    cmd: lvs
  register: lvs_output
  changed_when: false

- name: Show logical volumes
  ansible.builtin.debug:
    var: lvs_output.stdout_lines