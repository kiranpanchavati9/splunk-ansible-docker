---
- name: Download Docker repository file
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/rhel/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: "0644"

- name: Install Docker packages
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-pip
    state: present

- name: Install Docker Python SDK
  ansible.builtin.pip:
    name:
      - docker
    executable: pip3

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configure Docker data root
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "data-root": "/opt/docker"
      }
  notify: Restart Docker

- name: Create containerd storage directory
  ansible.builtin.file:
    path: /opt/containerd
    state: directory
    mode: "0755"

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate default containerd configuration
  ansible.builtin.shell: |
    containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Configure containerd data root
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: '^root = "/var/lib/containerd"'
    replace: 'root = "/opt/containerd"'
  notify: Restart Containerd

- name: Apply Docker and containerd configuration
  ansible.builtin.meta: flush_handlers

- name: Start and enable containerd service
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Start and enable Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true