- name: Configure Indexer as Cluster Peer
  community.docker.docker_container_exec:
    container: splunk-indexer
    user: splunk
    argv:
      - "{{ splunk_home }}/bin/splunk"
      - edit
      - cluster-config
      - -mode
      - peer
      - -manager_uri
      - "{{ cluster_manager_uri }}"
      - -replication_port
      - "9887"
      - -secret
      - "{{ cluster_secret }}"
      - -cluster_label
      - "{{ cluster_label }}"
      - -auth
      - "{{ splunk_admin_user }}:{{ splunk_admin_password }}"
  become: true
  become_user: splunk
  no_log: true
  notify: Restart Splunk


- name: Restart Splunk
  community.docker.docker_container_exec:
    container: splunk-indexer
    user: splunk
    argv:
      - "{{ splunk_home }}/bin/splunk"
      - restart
  become: true
  become_user: splunk
  no_log: true
  notify: Restart Splunk

- name: Verify Cluster Peer Status
  community.docker.docker_container_exec:
    container: splunk-indexer
    user: splunk
    argv:
      - "{{ splunk_home }}/bin/splunk"
      - show
      - cluster-status
      - -auth
      - "{{ splunk_admin_user }}:{{ splunk_admin_password }}"
  become: true
  become_user: splunk
  no_log: true
  register: cluster_status
  changed_when: false